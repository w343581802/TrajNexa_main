services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: trajnexa
      POSTGRES_PASSWORD: dev_only_change_me
      POSTGRES_DB: trajnexa
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trajnexa -d trajnexa"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - trajnexa_pgdata:/var/lib/postgresql/data
  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
  api:
    build: ./backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./storage:/data/storage
      # 本地 D-FINE ONNX 权重（不入库），供 /detect?engine=dfine 使用
      - ./models:/models:ro
    ports:
      - "127.0.0.1:8000:8000"
  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./storage:/data/storage
  frontend:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "127.0.0.1:5173:5173"
volumes:
  trajnexa_pgdata:
