services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: trajnexa
      POSTGRES_PASSWORD: dev_only_change_me
      POSTGRES_DB: trajnexa
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trajnexa -d trajnexa"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - trajnexa_pgdata:/var/lib/postgresql/data
  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
  api:
    build: ./backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./storage:/data/storage
      # 检测器配置与权重（权重不入库）：容器内路径固定为 /srv/config、/srv/models
      # 页面上的新增/编辑/删除要写回 detectors.json，上传权重要写 models/uploads，故不设只读
      - ./backend/config:/srv/config
      - ./backend/models:/srv/models
    ports:
      - "127.0.0.1:8000:8000"
  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./storage:/data/storage
      - ./backend/config:/srv/config
      - ./backend/models:/srv/models
  frontend:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "127.0.0.1:5173:5173"
volumes:
  trajnexa_pgdata:
