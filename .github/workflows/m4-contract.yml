name: M4 contract checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  m4a-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_m4a_observations.py tests/test_m4b_detection.py tests/test_m4b_preview_api.py tests/test_m4c_keyframes.py tests/test_m4c_api.py tests/test_m4d_vlm.py tests/test_m4d_attributes.py tests/test_m4d_experiment.py tests/test_m4d_case_guard.py tests/test_m4d_frame_review.py tests/test_m4d_api.py tests/test_m4d_local_client.py tests/test_m4d_loopback_smoke.py
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
